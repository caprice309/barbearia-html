<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Barbeiro</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .painel-container { max-width: 950px; margin: 40px auto; padding: 30px; background: white; border-radius: var(--arredondamento); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; margin-bottom: 40px; font-family: var(--fonte-textos); }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; vertical-align: middle; }
        th.cabecalho-azul { background-color: var(--cor-azul); color: white; }
        th.cabecalho-vermelho { background-color: var(--cor-vermelha); color: white; }
        tr:hover { background-color: #f8fafd; }
        #conteudo-admin { display: none; }
        .botao-concluir { background-color: #2e7d32; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background-color 0.2s, transform 0.2s; }
        .botao-concluir:hover { background-color: #1b5e20; transform: scale(1.05); }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span style="font-size: 2.2rem; filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));">💈</span>
            <h1>Área Restrita - Barbeiro</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Sair do Painel</a></li>
            </ul>
        </nav>
    </header>

    <main id="conteudo-admin">
        <div class="painel-container">
            
            <h2>📅 Agenda de Clientes (Serviços)</h2>
            <table>
                <thead>
                    <tr>
                        <th class="cabecalho-azul" style="border-radius: 8px 0 0 0;">Nome</th>
                        <th class="cabecalho-azul">Telefone</th>
                        <th class="cabecalho-azul">Serviço</th>
                        <th class="cabecalho-azul">Data e Hora</th>
                        <th class="cabecalho-azul" style="border-radius: 0 8px 0 0;">Ação</th>
                    </tr>
                </thead>
                <tbody id="tabela-agendamentos">
                </tbody>
            </table>

            <h2>🛒 Controle de Vendas (Loja Virtual)</h2>
            <table>
                <thead>
                    <tr>
                        <th class="cabecalho-vermelho" style="border-radius: 8px 0 0 0;">Cliente</th>
                        <th class="cabecalho-vermelho">Produto Comprado</th>
                        <th class="cabecalho-vermelho">Valor</th>
                        <th class="cabecalho-vermelho">Data</th>
                        <th class="cabecalho-vermelho" style="border-radius: 0 8px 0 0;">Ação</th>
                    </tr>
                </thead>
                <tbody id="tabela-pedidos">
                </tbody>
            </table>

        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC5I7WEUOo4tlteBuaaHj7NcoU91JHSpek",
            authDomain: "barbearia-narciso.firebaseapp.com",
            projectId: "barbearia-narciso",
            storageBucket: "barbearia-narciso.firebasestorage.app",
            messagingSenderId: "484721302723",
            appId: "1:484721302723:web:44b13501687e26c2499676"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const senhaCorreta = "admin123";
        let tentativa = prompt("Área Restrita do Barbeiro.\nDigite a senha de acesso:");

        if (tentativa === senhaCorreta) {
            document.getElementById("conteudo-admin").style.display = "block";
            carregarAgendamentos();
            carregarPedidos();
        } else {
            alert("Senha incorreta! Acesso negado.");
            window.location.href = "index.html";
        }

        async function carregarAgendamentos() {
            const tabela = document.getElementById("tabela-agendamentos");
            tabela.innerHTML = "<tr><td colspan='5' style='text-align:center;'>A carregar da nuvem...</td></tr>";
            
            try {
                const snapshot = await getDocs(collection(db, "agendamentos"));
                tabela.innerHTML = "";

                if (snapshot.empty) {
                    tabela.innerHTML = "<tr><td colspan='5' style='text-align:center;'>Nenhum agendamento pendente.</td></tr>";
                    return;
                }

                snapshot.forEach((documento) => {
                    const agenda = documento.data();
                    const id = documento.id;
                    
                    const linha = document.createElement("tr");
                    linha.innerHTML = `
                        <td><strong>${agenda.nome}</strong></td>
                        <td>${agenda.telefone}</td>
                        <td>${agenda.servico}</td>
                        <td>${agenda.data} às ${agenda.hora}</td>
                        <td><button class="botao-concluir" onclick="excluirAgendamento('${id}')">✔ Concluir</button></td>
                    `;
                    tabela.appendChild(linha);
                });
            } catch(erro) {
                tabela.innerHTML = "<tr><td colspan='5' style='text-align:center;'>Erro ao carregar os dados.</td></tr>";
            }
        }

        window.excluirAgendamento = async function(id) {
            if(confirm("Confirmar que o atendimento foi realizado?")) {
                await deleteDoc(doc(db, "agendamentos", id));
                carregarAgendamentos();
            }
        }

        async function carregarPedidos() {
            const tabela = document.getElementById("tabela-pedidos");
            tabela.innerHTML = "<tr><td colspan='5' style='text-align:center;'>A carregar da nuvem...</td></tr>";
            
            try {
                const snapshot = await getDocs(collection(db, "pedidos_loja"));
                tabela.innerHTML = "";

                if (snapshot.empty) {
                    tabela.innerHTML = "<tr><td colspan='5' style='text-align:center;'>Nenhuma entrega pendente.</td></tr>";
                    return;
                }

                snapshot.forEach((documento) => {
                    const pedido = documento.data();
                    const id = documento.id;
                    
                    const linha = document.createElement("tr");
                    linha.innerHTML = `
                        <td><strong>${pedido.cliente}</strong></td>
                        <td>${pedido.produto}</td>
                        <td><strong style="color: var(--cor-vermelha);">${pedido.valor}</strong></td>
                        <td>${pedido.dataPedido}</td>
                        <td><button class="botao-concluir" onclick="excluirPedido('${id}')">✔ Entregue</button></td>
                    `;
                    tabela.appendChild(linha);
                });
            } catch(erro) {
                tabela.innerHTML = "<tr><td colspan='5' style='text-align:center;'>Erro ao carregar os dados.</td></tr>";
            }
        }

        window.excluirPedido = async function(id) {
            if(confirm("O cliente já pagou e retirou este produto?")) {
                await deleteDoc(doc(db, "pedidos_loja", id));
                carregarPedidos();
            }
        }
    </script>
</body>
</html>
